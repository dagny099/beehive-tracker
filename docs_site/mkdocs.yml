site_name: Beehive Photo Metadata Tracker
site_url: https://hivetracker.barbhs.com
site_author: Barbara H. Smith
site_description: >-
  Transform your beehive inspection photos into a structured, searchable knowledge base with 
  automated metadata extraction, computer vision analysis, and environmental data integration.

# Repository
repo_name: dagny099/beehive-tracker
repo_url: https://github.com/dagny099/beehive-tracker
edit_uri: edit/main/docs_site/docs/

# Copyright
copyright: Copyright &copy; 2024 Barbara H. Smith

# Configuration
theme:
  name: material
  custom_dir: overrides
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate
  palette:
    - scheme: default
      primary: amber
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: amber
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  favicon: assets/favicon.png
  logo: assets/logo.png

# Plugins
plugins:
  - blog
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            members_order: source
            separate_signature: true
            show_root_heading: true
            show_source: false
            merge_init_into_class: true

# Customization
extra:
  homepage: https://hivetracker.barbhs.com
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dagny099
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/barbara-h-smith
  tags:
    Beekeeping: beekeeping
    Computer Vision: computer-vision
    Data Analysis: data-analysis
    API: api
    Streamlit: streamlit

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: dagny099
      repo: beehive-tracker
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/mkdocs.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Page tree
nav:
  - Home:
    - index.md
    - Overview: overview.md
    - Architecture: architecture.md
  - Getting Started:
    - getting-started/index.md
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
    - Configuration: getting-started/configuration.md
  - User Guide:
    - user-guide/index.md
    - Photo Upload: user-guide/photo-upload.md
    - Metadata Analysis: user-guide/metadata-analysis.md
    - Timeline View: user-guide/timeline-view.md
    - Calendar View: user-guide/calendar-view.md
    - Gallery View: user-guide/gallery-view.md
    - Data Export: user-guide/data-export.md
  - API Reference:
    - api-reference/index.md
    - Vision API: api-reference/vision.md
    - Weather API: api-reference/weather.md
    - Image Processing: api-reference/image-processing.md
    - Data Handling: api-reference/data-handling.md
    - UI Components: api-reference/ui-components.md
  - Deployment:
    - deployment/index.md
    - Docker: deployment/docker.md
    - Google Cloud Run: deployment/cloud-run.md
    - Environment Variables: deployment/environment.md
  - Development:
    - development/index.md
    - Project Structure: development/project-structure.md
    - Contributing: development/contributing.md
    - Testing: development/testing.md
  - Blog:
    - blog/index.md