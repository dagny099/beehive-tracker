site_name: Beehive Tracker — Docs
site_description: Shared base settings for Beehive Tracker documentation.
repo_url: https://github.com/username/beehive-tracker

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Beehive theme colors
    - scheme: default
      primary: amber
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate 
      primary: amber
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.tabs.link
    - toc.integrate
    - navigation.instant
    - navigation.tracking
    - navigation.top

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Keep extras minimal in the base; add heavy JS only in engineering if needed.
